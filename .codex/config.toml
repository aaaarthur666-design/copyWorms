# Project-scoped policy: Codex loads this only for this trusted repository.
# Keep Godot AI loopback-only and expose only the approved Godot-aware domains.
# Do not copy this entry into the user-level ~/.codex/config.toml. Writes still prompt.
sandbox_mode = "workspace-write"
[mcp_servers."godot-ai"]
url = "http://127.0.0.1:8000/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60
default_tools_approval_mode = "writes"
enabled_tools = [
  "editor_state",
  "scene_get_hierarchy",
  "node_get_properties",
  "session_activate",
  "logs_read",
  "editor_screenshot",
  "scene_manage",
  "scene_open",
  "scene_save",
  "node_create",
  "node_set_property",
  "node_manage",
  "resource_manage",
  "signal_manage",
  "animation_create",
  "animation_manage",
  "material_manage",
  "audio_manage",
  "particle_manage",
  "camera_manage",
  "ui_manage",
  "theme_manage",
  "tilemap_manage",
  "tileset_manage",
]

[sandbox_workspace_write]
network_access = true
